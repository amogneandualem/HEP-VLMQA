        y="770"
        width="430"
        height="125"
        rx="14"
        fill="#f8fafc"
        stroke="#64748b"
        stroke-width="2"/>

  <text x="330"
        y="803"
        class="head">
    V1 LoRA
  </text>

  <text x="330"
        y="831"
        class="body">
    4 understanding tasks
  </text>

  <text x="330"
        y="858"
        class="body">
    LoRA rank 8 · one epoch
  </text>


  <rect x="685"
        y="770"
        width="430"
        height="125"
        rx="14"
        fill="#f8fafc"
        stroke="#64748b"
        stroke-width="2"/>

  <text x="900"
        y="803"
        class="head">
    Multi-task LoRA
  </text>

  <text x="900"
        y="831"
        class="body">
    7 tasks · repeated-image per QA
  </text>

  <text x="900"
        y="858"
        class="body">
    LoRA rank 32 · no visual reuse
  </text>


  <rect x="1255"
        y="770"
        width="430"
        height="125"
        rx="14"
        fill="#ecfeff"
        stroke="#0891b2"
        stroke-width="2"/>

  <text x="1470"
        y="803"
        class="head">
    GM-LoRA
  </text>

  <text x="1470"
        y="831"
        class="body">
    7 tasks grouped by scientific figure
  </text>

  <text x="1470"
        y="858"
        class="body">
    shared visual processing · LoRA rank 32
  </text>


  <!-- one horizontal routing bus; no lines through boxes -->
  <path d="M1295 670
           L1295 720
           L330 720
           L330 760"
        class="arrow"/>

  <path d="M1295 670
           L1295 720
           L900 720
           L900 760"
        class="arrow"/>

  <path d="M1295 670
           L1295 760
           L1470 760"
        class="arrow"/>


  <!-- ====================================================== -->
  <!-- STAGE 5 -->
  <!-- ====================================================== -->

  <text x="55"
        y="945"
        class="lane">
    5. Held-out inference and evaluation
  </text>


  <rect x="445"
        y="970"
        width="410"
        height="95"
        rx="14"
        fill="#f8fafc"
        stroke="#64748b"
        stroke-width="2"/>

  <text x="650"
        y="1002"
        class="head">
    Deterministic answer generation
  </text>

  <text x="650"
        y="1030"
        class="body">
    image + exact benchmark question only
  </text>

  <text x="650"
        y="1053"
        class="tiny">
    no caption · no metadata · no reference answer
  </text>


  <rect x="1000"
        y="970"
        width="410"
        height="95"
        rx="14"
        fill="#f8fafc"
        stroke="#64748b"
        stroke-width="2"/>

  <text x="1205"
        y="1002"
        class="head">
    Evaluation
  </text>

  <text x="1205"
        y="1030"
        class="body">
    Token-F1 · ROUGE-L F1 · BERTScore F1
  </text>

  <text x="1205"
        y="1053"
        class="tiny">
    100 papers · 741 figure groups · 5,133 QA
  </text>


  <!-- training strategies merge into one inference protocol -->
  <path d="M330 895
           L330 940
           L650 940
           L650 960"
        class="arrow"/>

  <path d="M900 895
           L900 940
           L650 940"
        class="guide"/>

  <path d="M1470 895
           L1470 940
           L650 940"
        class="guide"/>

  <line x1="855"
        y1="1017"
        x2="990"
        y2="1017"
        class="arrow"/>

</svg>
