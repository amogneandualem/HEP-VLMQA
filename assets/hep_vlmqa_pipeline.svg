<svg xmlns="http://www.w3.org/2000/svg"
     width="1800"
     height="1110"
     viewBox="0 0 1800 1110">

  <!-- Permanent white background -->
  <rect width="1800" height="1110" fill="#ffffff"/>

  <defs>
    <marker id="arrow"
            markerWidth="10"
            markerHeight="10"
            refX="9"
            refY="3"
            orient="auto"
            markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z"
            fill="#4b5563"/>
    </marker>

    <style>
      .title {
        font: 700 28px Arial, Helvetica, sans-serif;
        fill: #111827;
        text-anchor: middle;
      }

      .lane {
        font: 700 18px Arial, Helvetica, sans-serif;
        fill: #374151;
      }

      .head {
        font: 700 18px Arial, Helvetica, sans-serif;
        fill: #111827;
        text-anchor: middle;
      }

      .body {
        font: 15px Arial, Helvetica, sans-serif;
        fill: #374151;
        text-anchor: middle;
      }

      .tiny {
        font: 13px Arial, Helvetica, sans-serif;
        fill: #4b5563;
        text-anchor: middle;
      }

      .arrow {
        stroke: #4b5563;
        stroke-width: 2.2;
        fill: none;
        marker-end: url(#arrow);
      }

      .guide {
        stroke: #9ca3af;
        stroke-width: 1.5;
        fill: none;
      }
    </style>
  </defs>

  <!-- ====================================================== -->
  <!-- TITLE -->
  <!-- ====================================================== -->

  <text x="900"
        y="42"
        class="title">
    HEP-VLMQA: Dataset Construction, Training, and Evaluation
  </text>

  <!-- ====================================================== -->
  <!-- STAGE 1 -->
  <!-- ====================================================== -->

  <text x="55"
        y="92"
        class="lane">
    1. Scientific paper processing
  </text>

  <rect x="55"
        y="115"
        width="250"
        height="98"
        rx="14"
        fill="#f8fafc"
        stroke="#64748b"
        stroke-width="2"/>

  <text x="180"
        y="145"
        class="head">
    HEP source papers
  </text>

  <text x="180"
        y="171"
        class="body">
    14,440 papers
  </text>

  <text x="180"
        y="194"
        class="tiny">
    scientific PDFs + figures
  </text>


  <rect x="365"
        y="115"
        width="270"
        height="98"
        rx="14"
        fill="#eff6ff"
        stroke="#3b82f6"
        stroke-width="2"/>

  <text x="500"
        y="143"
        class="head">
    MinerU extraction
  </text>

  <text x="500"
        y="169"
        class="body">
    figures · captions · text
  </text>

  <text x="500"
        y="192"
        class="tiny">
    local context + formula/image filtering
  </text>


  <rect x="695"
        y="115"
        width="300"
        height="98"
        rx="14"
        fill="#eff6ff"
        stroke="#3b82f6"
        stroke-width="2"/>

  <text x="845"
        y="143"
        class="head">
    Metadata preprocessing
  </text>

  <text x="845"
        y="169"
        class="body">
    cleaning · deduplication
  </text>

  <text x="845"
        y="192"
        class="tiny">
    domain/image type · similarity · keywords
  </text>


  <rect x="1055"
        y="115"
        width="300"
        height="98"
        rx="14"
        fill="#f5f3ff"
        stroke="#8b5cf6"
        stroke-width="2"/>

  <text x="1205"
        y="143"
        class="head">
    Semantic concept generation
  </text>

  <text x="1205"
        y="169"
        class="body">
    OpenAI-compatible LLM
  </text>

  <text x="1205"
        y="192"
        class="tiny">
