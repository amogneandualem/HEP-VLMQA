  <!-- STAGE 3 -->
  <!-- ====================================================== -->

  <text x="55"
        y="520"
        class="lane">
    3. Canonical benchmark assembly and leakage-safe splitting
  </text>


  <rect x="500"
        y="550"
        width="430"
        height="120"
        rx="14"
        fill="#f5f3ff"
        stroke="#8b5cf6"
        stroke-width="2"/>

  <text x="715"
        y="582"
        class="head">
    Canonical HEP-VLMQA assembly
  </text>

  <text x="715"
        y="610"
        class="body">
    122,987 QA-bearing figures
  </text>

  <text x="715"
        y="637"
        class="body">
    560,909 QA pairs · common schema
  </text>


  <rect x="1080"
        y="550"
        width="430"
        height="120"
        rx="14"
        fill="#f8fafc"
        stroke="#64748b"
        stroke-width="2"/>

  <text x="1295"
        y="582"
        class="head">
    Locked paper-level splits
  </text>

  <text x="1295"
        y="610"
        class="body">
    14,240 train · 100 validation · 100 test
  </text>

  <text x="1295"
        y="637"
        class="body">
    ID + image-hash leakage checks
  </text>


  <!-- separate V1 / V2 routes: no crossing -->
  <path d="M620 450
           L620 505
           L665 505
           L665 540"
        class="arrow"/>

  <path d="M1240 450
           L1240 505
           L765 505
           L765 540"
        class="arrow"/>

  <line x1="930"
        y1="610"
        x2="1070"
        y2="610"
        class="arrow"/>


