  </text>


  <rect x="980"
        y="305"
        width="520"
        height="145"
        rx="14"
        fill="#fff7ed"
        stroke="#f97316"
        stroke-width="2"/>

  <text x="1240"
        y="337"
        class="head">
    V2 — Scientific Provenance Reconstruction
  </text>

  <text x="1240"
        y="365"
        class="body">
    Inputs · Method · Figure Generation
  </text>

  <text x="1240"
        y="392"
        class="body">
    multimodal LLM provenance generation
  </text>

  <text x="1240"
        y="419"
        class="body">
    AutoResearch offline quality audit
  </text>


  <!-- clean branch -->
  <path d="M1205 213
           L1205 250
           L620 250
           L620 295"
        class="arrow"/>

  <path d="M1205 213
           L1205 295"
        class="arrow"/>


